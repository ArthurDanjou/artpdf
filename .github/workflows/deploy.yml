name: Deploy BentoPDF to Cloudflare Worker

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

# Langues UI incluses dans le build (separees par des espaces).
# "en" est toujours inclus (fallback). Re-applique a chaque run
# sur un checkout frais d'upstream : les maj upstream n'ecrasent rien.
env:
  LANGUAGES: "en fr"

permissions:
  contents: read

concurrency:
  group: artpdf-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Config de deploy (ce repo) : wrangler.jsonc, worker.js, script.
      - uses: actions/checkout@v4
        with:
          path: self

      # Code source upstream, toujours a jour a chaque run.
      - uses: actions/checkout@v4
        with:
          repository: alam00000/bentopdf
          ref: main
          path: upstream

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: upstream/package-lock.json

      - name: Select languages
        run: node self/scripts/select-languages.mjs upstream "$LANGUAGES"

      - name: Build upstream
        working-directory: upstream
        run: npm ci && VITE_USE_CDN=true VITE_DEFAULT_LANGUAGE=fr SIMPLE_MODE=true npm run build

      - name: Prune oversized assets
        run: node self/scripts/prune-large-assets.mjs upstream/dist 25

      - name: Prepare Cloudflare files
        run: node self/scripts/prepare-cloudflare.mjs upstream self/worker.js self/wrangler.jsonc

      - name: Deploy Worker
        working-directory: upstream
        run: npx -y wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
